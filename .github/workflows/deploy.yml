# Builds the site and publishes it to GitHub Pages.
# Runs (1) every time something is saved on the main branch, (2) every night, so that events
# move from "Upcoming" to "Past" on their own, and (3) on demand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *' # every day at 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build and upload the site
        uses: withastro/action@v6
        # The site address is set in astro.config.mjs (https://ehtune.github.io by default).

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
