# ─────────────────────────────────────────────────────────────────────────────
#  PARTNER INSTITUTIONS
#  Each block starting with "- id:" is one institution.
#   id         short code, lowercase, no spaces. Members refer to it (institution: unisi).
#   shortName  the abbreviation shown in the members list, filters and map.
#   lat / lon  position on the homepage map (Google Maps: right-click → the two numbers).
#  To add an institution: copy a whole block, paste it at the end, change the values.
#  Order here = order on the site (institutions are grouped by city).
# ─────────────────────────────────────────────────────────────────────────────

