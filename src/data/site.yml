shortName: EH/tune
fullName: Tuscan University Network in Economic History
tagline: Economic historians across Tuscany's universities, working together.

# Shown in Google results and when the site is shared on social media.
description: >-
  EH/tune connects the economic historians of Tuscany's universities and research
  institutes through shared seminars, conferences, doctoral training and research projects.

# HOMEPAGE — mission (short) and history (a few paragraphs, separated by a blank line).
mission: >-
  EH/tune brings together the economic historians working in Tuscany's universities and
  research institutes. We organise seminars, workshops and an annual conference, support
  doctoral students and early-career researchers, and build shared research projects on the
  long-run economic history of Italy, Europe and the wider world.

history: |
  EH/tune grew out of years of informal collaboration among economic historians in Tuscany,
  many of whom already teach together in the joint PhD in Economics of the Tuscan Universities
  offered by Siena, Florence and Pisa.

  The network gives that collaboration a permanent home: a common calendar of seminars, a
  meeting place for faculty and doctoral students across campuses, and a platform for research
  projects too large for any single department.

goals:
  - title: Share research
    text: A common calendar of seminars and workshops, so that work presented in one city reaches colleagues in all the others.
  - title: Train the next generation
    text: Doctoral and early-career workshops where students present work in progress to faculty from every member institution.
  - title: Build common projects
    text: Joint research tracks, datasets and funding applications that draw on the strengths of several departments.
  - title: Open Tuscany to the field
    text: Visiting speakers, an annual conference and links with economic history associations in Italy and abroad.

